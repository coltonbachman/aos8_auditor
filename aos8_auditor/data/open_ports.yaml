- name: Internet Control Message Protocol (ICMP)
  transport: UDP
  protocol: 1
  ports:
  - 768
  - 65535
  flows: MCR <> MD | MD <> MD | AP <> MD
  description: Used to verify reachability between managed devices and path reachability for SD-Branch
    applications.
  notes: This protocol should not be restricted between managed devices to aid in troubleshooting, but
    maybe restricted to specific CIDRs and hosts (see below example).
  guidance: do_not_block
  default_rules:
  - ipv4 permit any proto 1 ports 768 65535 bandwidth-contract cpbwc-ipv4-icmp
  example_rules:
  - ipv4 permit 192.168.18.0 255.255.255.0 proto 1 ports 768 65535 bandwidth-contract cpbwc-ipv4-icmp
    <- ADMIN CIDR
  - ipv4 permit 192.168.66.0 255.255.255.0 proto 1 ports 768 65535 bandwidth-contract cpbwc-ipv4-icmp
    <- MCR CIDR
  - ipv4 permit 192.168.76.0 255.255.255.0 proto 1 ports 768 65535 bandwidth-contract cpbwc-ipv4-icmp
    <- MD CIDR
  - ipv4 deny any proto 1 ports 768 65535 bandwidth-contract cpbwc-ipv4-icmp
- name: Internet Group Management Protocol (IGMP)
  transport: UDP
  protocol: 2
  ports:
  - 0
  - 65535
  flows: MD <> PIM Router
  description: Used if PIM Proxy is enabled on the MDs to exchange group membership reports to upstream
    PIM routers.
  notes: IGMP is a critical network protocol and should not be restricted or blocked.
  guidance: do_not_block
  default_rules:
  - ipv4 permit any proto 2 ports 0 65535
  example_rules: []
