  example_rules:
  - ipv4 deny any proto 6 ports 2300 2300 bandwidth-contract cpbwc-ipv4-telnet
  - ipv4 deny any proto 6 ports 2323 2323 bandwidth-contract cpbwc-ipv4-telnet
