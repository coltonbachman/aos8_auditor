# Operator answers for controls that cannot be proven from a read-only account
# (password value, EAP type, physical/TEL, backup process, "unused" ports, etc.).
# A manual control with a matching entry takes the attested status and is marked
# classification_basis=attestation in the report. Copy to attestations.yaml and
# pass with: aos8-audit ... --attestations attestations.yaml
#
# control_id:
#   status: pass | fail | warn | not_applicable
#   justification: "who attested, what was verified, date"

