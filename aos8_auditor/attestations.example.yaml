  justification: "Admin password rotated from default during provisioning — J.Doe 2026-05-01"

AOS8-PHYS-TEL-001:
  status: not_applicable
  justification: "Virtual Mobility Controller — no physical TELs apply"

AOS8-NET-PORT-001:
  status: pass
  justification: "Port plan reviewed; all unused ports administratively shut — net-eng 2026-05-02"
