name: hitrust
framework: HITRUST CSF
version: "11.0"
description: >
  Crosswalk of ArubaOS 8 WLAN-controller hardening controls to HITRUST CSF v11
  control references, focused on the access-control (01.x), network-protection
  (09.x), wireless, cryptography, and audit-logging requirements that a WLAN
  controller's configuration can evidence.
disclaimer: >
  Advisory crosswalk of the WLAN-controller-configuration slice only. It is NOT a
  HITRUST CSF certification, validated assessment, or assessor opinion. A
  requirement shown MET here is evidenced only at the controller layer and may
  still require non-WLAN evidence (policy, host, process, physical-facility, and
  organizational artifacts) to satisfy the full HITRUST control. Validate with a
  qualified HITRUST assessor (External Assessor / Authorized Assessor).
profile: high_security
org_profile_defaults:
  wip_required: true            # 09.m / 01.x wireless intrusion detection
  fips_required: false
requirements:
  - id: "01.b"
    title: User Registration / centralized identity for access provisioning
    controls: [AOS8-AUTH-SERVER-001, AOS8-AUTH-SERVERGROUP-001, AOS8-MGMT-LOCALAUTH-001, 
          AOS8-AUTH-LOCALDB-DOT1X-001]
  - id: "01.c"
    title: Privilege Management / least-privilege access enforcement (roles)
    controls: [AOS8-ROLE-POLICY-001, AOS8-ROLE-DEFAULTROLE-001, AOS8-ROLE-INITROLE-001, 
          AOS8-ADMIN-POLICY-001, AOS8-ROLE-STATEFUL-001]
  - id: "01.d"
    title: User Password Management / strong password policy
    controls: [AOS8-INIT-001, AOS8-MGMT-PWDPOL-001]
  - id: "01.j"
    title: User Authentication for External Connections (strong auth for remote/admin access)
    controls: [AOS8-MGMT-SSH-PUBKEY-001, AOS8-MGMT-SSH-VERSION-001, AOS8-MGMT-WEBUI-CERTAUTH-001, 
          AOS8-MGMT-CERT-001, AOS8-AUTH-SERVER-001]
  - id: "01.l"
    title: Remote Diagnostic and Configuration Port Protection (mgmt access policy)
    controls: [AOS8-ADMIN-POLICY-001, AOS8-ADMIN-POLICY-002, AOS8-ROLE-UDP6869-DENY-001, 
          AOS8-NET-CTRLIP-001]
  - id: "01.m"
    title: Segregation in Networks (VLAN segmentation of trusted/untrusted)
    controls: [AOS8-NET-VLAN-SEGMENT-001, AOS8-NET-TRUSTED-VLAN-001, AOS8-NET-DEFAULTVLAN-001, 
          AOS8-WLAN-VLAN-001, AOS8-WLAN-VLAN1-001]
  - id: "01.n"
    title: Network Connection / Routing Control (policy-controlled untrusted ports)
    controls: [AOS8-NET-UNTRUSTED-PORT-001, AOS8-NET-PORT-001, AOS8-ROLE-NETDEST-MEMBERSHIP-001, 
          AOS8-NET-NATIVEVLAN-001]
  - id: "01.o"
    title: Secure Log-on Procedures / login banner and warning
    controls: [AOS8-GLOBAL-BANNER-001]
  - id: "01.q"
    title: User Identification and Authentication (no shared/default management credentials)
    controls: [AOS8-INIT-001, AOS8-MGMT-LOCALAUTH-001, AOS8-AUTH-SERVER-001, 
          AOS8-AUTH-SERVERGROUP-NONDEFAULT-001]
  - id: "01.s"
    title: Use of System Utilities / cleartext management transports disabled
    controls: [AOS8-MGMT-SSH-DISABLE-INSECURE-MGMT-001, AOS8-MGMT-FILETRANSFER-SCP-001, 
          AOS8-GLOBAL-SNMP-001]
  - id: "01.t"
    title: Session Time-out (idle session termination)
    controls: [AOS8-GLOBAL-TIMEOUT-001, AOS8-GLOBAL-TIMEOUT-002, AOS8-MGMT-WEBUI-SESSLIMIT-001]
  - id: "01.x"
    title: Wireless Access Restrictions / secured wireless authentication
    controls: [AOS8-WLAN-001, AOS8-DOT1X-001, AOS8-AUTH-EAP-TYPE-001, AOS8-WLAN-FWDMODE-001, 
          AOS8-WLAN-HIDESSID-001, AOS8-WLAN-VAPEXCLUDE-001]
  - id: "06.h"
    title: Technical Compliance Checking / no unsaved or default-VLAN exposure
    controls: [AOS8-INIT-PERSIST-001, AOS8-NET-MGMTIF-001, AOS8-WLAN-DEFGROUP-001, AOS8-AP-GROUP-001]
  - id: "09.m"
    title: Network Controls (managed network security, wireless IDS, segmentation)
    controls: [AOS8-WIP-LIC-001, AOS8-WIP-ROGUE-DETECT-001, AOS8-WIP-CONTAINMENT-001, 
          AOS8-WIP-MASTER-001, AOS8-NET-VLAN-SEGMENT-001, AOS8-NET-VRRP-001]
  - id: "09.s"
    title: Information Exchange / secured transfer of system files
    controls: [AOS8-MGMT-FILETRANSFER-SCP-001, AOS8-MGMT-IMAGE-TRANSFER-001, 
          AOS8-MGMT-SSH-DISABLE-INSECURE-MGMT-001]
  - id: "09.aa"
    title: Audit Logging (event logging to a central log server)
    controls: [AOS8-GLOBAL-SYSLOG-001, AOS8-MGMT-LOGCOPY-001]
  - id: "09.ab"
    title: Monitoring System Use (wireless intrusion / rogue monitoring review)
    controls: [AOS8-WIP-DASHBOARD-001, AOS8-WIP-ROGUE-DETECT-001, AOS8-WIP-AM-001, 
          AOS8-WIP-BLACKLIST-ENABLE-001]
  - id: "09.af"
    title: Clock Synchronization (authenticated NTP for accurate log timestamps)
    controls: [AOS8-GLOBAL-NTP-001, AOS8-INIT-CLOCK-001, AOS8-INIT-TIMEZONE-001]
  - id: "06.d"
    title: Data Protection / Cryptographic Controls (FIPS-validated cryptography)
    controls: [AOS8-GLOBAL-FIPS-001, AOS8-MGMT-CSR-001, AOS8-MGMT-CERT-IMPORT-001, 
          AOS8-MGMT-TRUSTEDCA-001]
  - id: "10.f"
    title: Policy on the Use of Cryptographic Controls (strong wireless/transport crypto)
    controls: [AOS8-WLAN-001, AOS8-AUTH-EAP-TLS-CERTS-001, AOS8-AUTH-LDAP-LDAPS-001, 
          AOS8-MGMT-CERT-001]
  - id: "08.b"
    title: Physical Entry Controls / tamper-evident protection of FIPS appliance
    controls: [AOS8-PHYS-SECKIT-001, AOS8-PHYS-TEL-001, AOS8-PHYS-CONSOLE-001, AOS8-GLOBAL-LCD-001]
